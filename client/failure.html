<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pago no completado · Lunnea</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; font-family: 'DM Sans', sans-serif; background: #faf9f6; color: #222; margin: 0; }
        .box { max-width: 450px; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h1 { font-family: 'Dancing Script', cursive; font-size: 2.5rem; color: #c94a4a; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 25px; line-height: 1.6; }
        .btn { display: inline-block; background: #222; color: #fff; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: 500; transition: background 0.3s; }
        .btn:hover { background: #c94a4a; }
    </style>
</head>
<body>
    <div class="box">
        <span>⚠️</span>
        <h1>El pago no pudo procesarse</h1>
        <p>Hubo un inconveniente con tu tarjeta o método de pago. No te preocupes, puedes intentarlo de nuevo cuando gustes.</p>
        <a href="index.html" class="btn">Volver a la tienda</a>
    </div>
</body>
</html>
